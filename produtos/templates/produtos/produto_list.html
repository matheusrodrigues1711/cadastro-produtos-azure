<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
</head>
<body>
    <h1>Produtos</h1>
    <a href="{% url 'produto_create' %}">+ Novo Produto</a>
    <table border="1" cellpadding="8" style="margin-top: 15px; border-collapse: collapse;">
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Ações</th>
        </tr>
        {% for produto in produtos %}
        <tr>
            <td>{{ produto.nome }}</td>
            <td>{{ produto.descricao }}</td>
            <td>R$ {{ produto.preco }}</td>
            <td>{{ produto.quantidade }}</td>
            <td>
                <a href="{% url 'produto_update' produto.pk %}">Editar</a> |
                <a href="{% url 'produto_delete' produto.pk %}">Excluir</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">Nenhum produto cadastrado.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
