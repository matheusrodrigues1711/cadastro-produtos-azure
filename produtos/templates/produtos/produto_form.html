{% extends 'produtos/base.html' %}
{% block title %}{% if object %}Editar{% else %}Novo{% endif %} Produto{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if object %}Editar{% else %}Novo{% endif %} Produto</h1>
<div class="card shadow-sm p-4" style="max-width: 500px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'produto_list' %}" class="btn btn-link">Cancelar</a>
    </form>
</div>
{% endblock %}
